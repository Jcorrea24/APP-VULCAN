<div class="login-form">
        <h2 class="login-form__title">Iniciar Sesión</h2>
        <form action="#" method="POST" class="login-form__form">
            <div class="login-form__group">
                <label for="username" class="login-form__label">Usuario o Email:</label>
                <input type="text" id="username" name="username" class="login-form__input" placeholder="tu.usuario" required>
            </div>

            <div class="login-form__group">
                <label for="password" class="login-form__label">Contraseña:</label>
                <input type="password" id="password" name="password" class="login-form__input" placeholder="••••••••" required>
            </div>

            <div class="login-form__group login-form__group--options">
                <label class="login-form__checkbox-label">
                    <input type="checkbox" name="remember" class="login-form__checkbox">
                    Recordarme
                </label>
                <a href="#" class="login-form__link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="login-form__button login-form__button--primary">Entrar</button>
            
            <p class="login-form__text">
                ¿No tienes una cuenta? <a href="#" class="login-form__link">Regístrate aquí</a>
            </p>
        </form>
    </div>
